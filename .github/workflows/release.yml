name: Release QuestChain
run-name: Release QuestChain (${{ inputs.preview && 'preview' || inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version change
        type: choice
        options: [patch, minor, exact]
        default: patch
        required: true
      version:
        description: Exact version without v (only for exact, e.g. 1.0.0 or 0.2.0-beta.1)
        type: string
        default: ''
      preview:
        description: Preview the version and ZIP without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: questchain-create-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require a current main snapshot
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo '::error::Run Release QuestChain from main.'
            exit 1
          fi
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::main has advanced. Start a new release run from the current main commit.'
            exit 1
          fi

      - name: Bump source TOC and check release identity
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          version=$(python3 tools/bump-version.py "$BUMP" --version "$EXACT_VERSION")
          tag="v$version"
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if [[ -n "$existing" ]] || grep -Fxq -- "$tag" <<< "$releases"; then
            echo "::error::Version $version already has a tag, release, or publication reservation. Choose a new version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create local release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ForeverQuestChain/ForeverQuestChain.toc
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "QuestChain $VERSION"

      - name: Verify release candidate
        env:
          PACKAGER_SCRIPT: ${{ runner.temp }}/questchain-packager.sh
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          for test in tests/*.lua; do
            lua5.1 "$test"
          done
          luac5.1 -p ForeverQuestChain/*.lua
          python3 tests/release.py
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/BigWigsMods/packager/01e8631a69c69d7654c788d152630d5fed9e3812/release.sh \
            --output "$PACKAGER_SCRIPT"
          python3 tests/package.py
          bash tools/prepare-release.sh tag "$RELEASE_TAG"
          bash "$PACKAGER_SCRIPT" -d -g forever -n 'QuestChain-{project-version}'
          test -f ".release/QuestChain-$RELEASE_TAG.zip"

      - name: Retain candidate ZIP
        uses: actions/upload-artifact@v6
        with:
          name: QuestChain-candidate-${{ steps.version.outputs.tag }}
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Push verified release commit and tag together
        if: ${{ !inputs.preview }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Summarize release preparation
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          {
            printf 'QuestChain candidate: %s\n\n' "$RELEASE_TAG"
            printf 'Verified commit: %s\n\n' "$(git rev-parse HEAD)"
            if [[ "$PREVIEW" == true ]]; then
              printf 'Preview only: main and remote tags were not changed. The candidate ZIP is available in this run.\n'
            else
              printf 'Pushed the version commit and matching tag atomically. The packaging workflow will test and publish this tag.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: prepare
    if: ${{ !inputs.preview }}
    permissions:
      contents: write
    uses: ./.github/workflows/curseforge.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
