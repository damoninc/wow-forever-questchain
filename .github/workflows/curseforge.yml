name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep every main deployment queued, rather than replacing pending releases.
concurrency:
  group: questchain-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test Lua and automatic versions
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          for test in tests/*.lua; do lua5.1 "$test"; done
          luac5.1 -p ForeverQuestChain/*.lua
          python3 tests/release.py

      - name: Test real BigWigs packages without publishing
        env:
          PACKAGER_SCRIPT: ${{ runner.temp }}/questchain-packager.sh
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/BigWigsMods/packager/01e8631a69c69d7654c788d152630d5fed9e3812/release.sh \
            --output "$PACKAGER_SCRIPT"
          python3 tests/package.py

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Allocate stable version on this merged commit
        id: version
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo '::error::CF_API_TOKEN is required for main deployments.'
            exit 1
          fi
          git fetch origin --tags
          tag=$(python3 tools/release-version.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$(git tag --points-at HEAD --list "$tag")" ]]; then
            if ! release=$(gh release view "$tag" --json isDraft,isPrerelease,assets); then
              echo '::error::An earlier deployment reserved this version. Inspect its upload logs and retained files before retrying an uncertain CurseForge POST.'
              exit 1
            fi
            if ! jq -e --arg zip "QuestChain-$tag.zip" '
              .isDraft == false and .isPrerelease == false
              and ([.assets[].name] | index($zip) != null and index("release.json") != null
                and index("curseforge-upload.json") != null)
            ' <<< "$release" > /dev/null; then
              echo '::error::An earlier deployment is incomplete. Inspect its retained upload files before retrying an uncertain CurseForge POST.'
              exit 1
            fi
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "QuestChain $tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Build once and upload the same GA ZIP to both hosts
        if: steps.version.outputs.complete != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/BigWigsMods/packager/01e8631a69c69d7654c788d152630d5fed9e3812/release.sh \
            --output "$RUNNER_TEMP/questchain-publisher.sh"
          python3 tools/prepare-publisher.py "$RUNNER_TEMP/questchain-publisher.sh"
          # Give BigWigs the generated tag context so a main push is packaged as GA.
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_NAME="$RELEASE_TAG" \
            bash "$RUNNER_TEMP/questchain-publisher.sh" -g forever -n 'QuestChain-{project-version}'
          gh release upload "$RELEASE_TAG" .release/curseforge-upload.json

      - name: Retain the actual deployment files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuestChain-${{ steps.version.outputs.tag }}
          path: |
            .release/*.zip
            .release/release.json
            .release/curseforge-upload.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify stable release and identical uploaded bytes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release download "$RELEASE_TAG" --pattern '*.zip' --pattern release.json \
            --pattern curseforge-upload.json --dir "$RUNNER_TEMP/questchain-published"
          cd "$RUNNER_TEMP/questchain-published"
          jq -e --arg tag "$RELEASE_TAG" --arg source "$SOURCE_SHA" '
            (.id | type == "number") and .version == $tag and .sourceCommit == $source
            and .filename == ("QuestChain-" + $tag + ".zip") and .releaseType == "release"
          ' curseforge-upload.json
          jq -r '.sha256 + "  " + .filename' curseforge-upload.json | sha256sum --check
          jq -e --arg tag "$RELEASE_TAG" '
            .releases | length == 1 and (.[0] | .version == $tag
              and .filename == ("QuestChain-" + $tag + ".zip")
              and .metadata == [{flavor:"forever",interface:16001}])
          ' release.json
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false and .isPrerelease == false)' | grep -Fx true
          {
            printf 'Published %s from %s to GitHub and CurseForge as Release.\n\n' "$RELEASE_TAG" "$SOURCE_SHA"
            printf 'GitHub: https://github.com/%s/releases/tag/%s\n\n' "$GH_REPO" "$RELEASE_TAG"
            printf 'CurseForge project 1792071, file %s\n\n' "$(jq -r '.id' curseforge-upload.json)"
            printf 'The GitHub ZIP matches the checksum of the ZIP uploaded to CurseForge.\n'
          } >> "$GITHUB_STEP_SUMMARY"
