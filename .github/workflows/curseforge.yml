name: Package QuestChain

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Existing tag created by Release QuestChain
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: questchain-package-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Lua 5.1 tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          for test in tests/*.lua; do
            lua5.1 "$test"
          done
          luac5.1 -p ForeverQuestChain/*.lua
          python3 tests/release.py

      - name: Test release packaging without publishing
        env:
          # Same immutable version as the packaging actions below (v2.7.0).
          PACKAGER_SCRIPT: ${{ runner.temp }}/questchain-packager.sh
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/BigWigsMods/packager/01e8631a69c69d7654c788d152630d5fed9e3812/release.sh \
            --output "$PACKAGER_SCRIPT"
          python3 tests/package.py

      - name: Prepare packaged version
        id: prepare
        env:
          REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          bash tools/prepare-release.sh "$REF_TYPE" "$REF_NAME"
          # BigWigs skips branch pushes at a tagged commit; that tag owns the package.
          if [[ "$REF_TYPE" != tag && -n "$(git tag --points-at HEAD)" ]]; then
            echo 'tagged_branch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP
        if: steps.prepare.outputs.tagged_branch != 'true'
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -g forever -n QuestChain-{project-version}
          pandoc: 'false'

      - uses: actions/upload-artifact@v6
        if: steps.prepare.outputs.tagged_branch != 'true'
        with:
          name: QuestChain-${{ inputs.release_tag || github.sha }}
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: package
    if: inputs.release_tag != '' || (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check publication prerequisites
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::error::Set the CF_API_TOKEN repository secret before publishing a release."
            exit 1
          fi
          bash tools/prepare-release.sh tag "$RELEASE_TAG"
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            echo "::error::A release or upload reservation already exists for $RELEASE_TAG. Inspect GitHub and CurseForge before recovery; see README.md."
            exit 1
          fi

      - name: Prepare single-attempt publisher
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/BigWigsMods/packager/01e8631a69c69d7654c788d152630d5fed9e3812/release.sh \
            --output "$RUNNER_TEMP/questchain-publisher.sh"
          python3 tools/prepare-publisher.py "$RUNNER_TEMP/questchain-publisher.sh"

      - name: Reserve publication
        id: reservation
        run: |
          reservation_id=$(gh api --method POST "repos/$GH_REPO/releases" \
            -f tag_name="$RELEASE_TAG" -f name="QuestChain $RELEASE_TAG" \
            -f body="Publication in progress. If interrupted, check CurseForge before retrying; see the repository's release recovery instructions." \
            -F draft=true --jq '.id')
          echo "id=$reservation_id" >> "$GITHUB_OUTPUT"

      - name: Publish tested tag to CurseForge and GitHub
        run: bash "$RUNNER_TEMP/questchain-publisher.sh" -g forever -n 'QuestChain-{project-version}'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ github.token }}

      - name: Retain publication files for recovery
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuestChain-publication-${{ env.RELEASE_TAG }}
          path: |
            .release/*.zip
            .release/release.json
            .release/ForeverQuestChain/CHANGELOG.md
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Verify published release
        run: |
          release=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets,url)
          jq -e --arg zip "QuestChain-$RELEASE_TAG.zip" '
            .isDraft == false
            and ([.assets[].name] | index($zip) != null and index("release.json") != null)
          ' <<< "$release"
          gh release download "$RELEASE_TAG" --pattern release.json --dir "$RUNNER_TEMP/questchain-published"
          interface=$(awk '/^## Interface:/ {print $3; exit}' ForeverQuestChain/ForeverQuestChain.toc)
          jq -e --arg version "$RELEASE_TAG" --argjson interface "$interface" '
            .releases | length == 1 and (.[0] |
              .version == $version and .filename == ("QuestChain-" + $version + ".zip")
              and .metadata == [{flavor:"forever", interface:$interface}])
          ' "$RUNNER_TEMP/questchain-published/release.json"
          {
            printf 'Published QuestChain %s\n\n' "$RELEASE_TAG"
            jq -r '.url' <<< "$release"
            printf '\nCurseForge project: 1792071. File approval and search indexing may follow publication.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove unused publication reservation
        env:
          RESERVATION_ID: ${{ steps.reservation.outputs.id }}
        run: |
          # GitHub can keep a draft separate from the packager's published release.
          # Delete only our recorded draft; never delete the published release/tag.
          reservation=$(gh api "repos/$GH_REPO/releases/$RESERVATION_ID")
          if jq -e --arg tag "$RELEASE_TAG" '.draft == true and .tag_name == $tag' <<< "$reservation" > /dev/null; then
            gh api --method DELETE "repos/$GH_REPO/releases/$RESERVATION_ID"
          fi
